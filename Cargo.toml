[package]
name = "antigravity-fast-core"
version = "0.1.0"
edition = "2021"
authors = ["Antigravity High-Speed Intelligence Team"]
description = "High-speed local code intelligence layer: BLAKE3 Merkle tree, Crepe sparse n-gram inverted index, Code STAIR AST symbol trie, and stdio MCP server"

[dependencies]
blake3 = { version = "1.5", features = ["rayon"] }
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
regex-syntax = "0.8"
walkdir = "2.4"
ignore = "0.4"
rayon = "1.10"
clap = { version = "4.4", features = ["derive"] }
tree-sitter = "0.27"
tree-sitter-language = "0.1"
chrono = "0.4"

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "antigravity_fast_core"
path = "src/lib.rs"

[[bin]]
name = "antigravity-fast-core"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
